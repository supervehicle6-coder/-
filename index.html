<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පින්බර වෙසක් මංගල්‍යයක් වේවා!</title>
    
    <!-- ලස්සන සිංහල සහ ඉංග්‍රීසි අකුරු සඳහා Google Fonts එකතු කිරීම -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nokora:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">

    <style>
        /* මුළු පිටුවේම පසුබිම - හිත නිවෙන තද නිල් පැහැයක් */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: 'Nokora', sans-serif; /* සරල, පිරිසිදු සිංහල අකුරු */
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* පසුබිමේ සෙමින් නිවී නිවී දැල්වෙන තරු (Simple Background Animation) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.25; }
        }

        /* ඉතා සරල පිරිසිදු කාඩ් එකක් */
        .card {
            max-width: 450px;
            width: 85%;
            background-color: #1b263b; /* තද නිල් පැහැති සරල පසුබිම */
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid #415a77;
            position: relative; /* තරු වලට උඩින් පෙනෙන්න */
        }

        /* රූප සරලව මැදට ගැනීම */
        .images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* බුදු පිළිමය සහ වෙසක් කූඩුව සෙමින් ලස්සනට දිලිසීම */
        .buddha {
            width: 100px;
            filter: drop-shadow(0 0 10px #ffb703);
            animation: softGlow 3s infinite alternate ease-in-out;
        }

        .lantern {
            width: 70px;
            filter: drop-shadow(0 0 8px #ff4d6d);
            animation: softGlow 3s infinite alternate ease-in-out;
        }

        @keyframes softGlow {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.03); opacity: 1; }
        }

        /* ප්‍රධාන මාතෘකාව - ආකර්ෂණීය සාම්ප්‍රදායික අකුරු මෝස්තරය */
        h1 {
            font-family: 'Yatra One', serif;
            color: #ffb703; /* රන්වන් පැහැය */
            font-size: 1.8rem;
            margin: 10px 0;
            font-weight: normal;
        }

        /* එවපු කෙනාගේ නම */
        .name-text {
            font-size: 1.2rem;
            color: #00f5d4;
            margin: 15px 0;
            font-weight: bold;
        }

        /* නිවන් පණිවිඩය */
        .message {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        /* සරල Input සහ Buttons */
        .box {
            background-color: #0d1b2a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .box p {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #8a9aad;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #415a77;
            background-color: #1b263b;
            color: white;
            text-align: center;
            font-size: 0.9rem;
        }

        button {
            background-color: #ffb703;
            color: #0d1b2a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 85%;
        }

        button:hover {
            background-color: #ffea00;
        }

        /* Share බොත්තම් */
        .share-box {
            display: none;
            margin-top: 15px;
        }

        .share-btn {
            display: block;
            text-decoration: none;
            color: white;
            padding: 8px;
            margin: 5px auto;
            border-radius: 5px;
            font-size: 0.9rem;
            width: 80%;
            font-weight: bold;
        }
        .whatsapp { background-color: #25D366; }
        .facebook { background-color: #1877F2; }

        /* පැත්තේ තියෙන කුඩා Music Button එක */
        .music-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background-color: rgba(255, 183, 3, 0.2);
            border: 1px solid #ffb703;
            border-radius: 50%;
            color: #ffb703;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- රූප දෙක සරලව -->
        <div class="images">
            <!-- බුදු පිළිමය -->
            <svg class="buddha" viewBox="0 0 100 100" fill="#ffb703">
                <path d="M50,15 C45,15 43,20 43,25 C43,27 45,30 47,31 C40,35 35,45 35,55 C35,65 30,70 25,75 C20,80 30,85 50,85 C70,85 80,80 75,75 C70,70 65,65 65,55 C65,45 60,35 53,31 C55,30 57,27 57,25 C57,20 55,15 50,15 Z M50,35 C53,35 55,38 55,42 C55,46 53,48 50,48 C47,48 45,46 45,42 C45,38 47,35 50,35 Z"/>
                <circle cx="50" cy="8" r="3" fill="#ffea00"/>
            </svg>
            <!-- වෙසක් කූඩුව -->
            <svg class="lantern" viewBox="0 0 100 120">
                <polygon points="50,10 80,40 50,70 20,40" fill="#ff4d6d" stroke="#fff" stroke-width="1.5"/>
                <line x1="50" y1="70" x2="50" y2="110" stroke="#ff4d6d" stroke-width="3"/>
                <line x1="35" y1="60" x2="35" y2="100" stroke="#ffea00" stroke-width="2"/>
                <line x1="65" y1="60" x2="65" y2="100" stroke="#ffea00" stroke-width="2"/>
            </svg>
        </div>

        <!-- මාතෘකාව -->
        <h1>පින්බර වෙසක් මංගල්‍යයක් වේවා!</h1>
        
        <!-- නම පෙන්වන තැන -->
        <div class="name-text" id="nameDisplay"></div>

        <!-- වෙසක් සුභපැතුම -->
        <p class="message">
            ලොව්තුරු බුදු පියාණන් වහන්සේගේ තෙමඟුල සිහිපත් කරන මේ පින්බර වෙසක් සමයේ, 
            ඔබ සැමට නිදුක් නිරෝගී, ශාන්ත වූ වෙසක් මංගල්‍යයක් වේවායි ප්‍රාර්ථනා කරමි!
        </p>

        <!-- නම හදන සරල කොටස -->
        <div class="box">
            <p>ඔයාගේ නමින් අලුත් ලින්ක් එකක් හදන්න:</p>
            <input type="text" id="nameInput" placeholder="ඔයාගේ නම මෙතන ලියන්න">
            <button onclick="makeLink()">ලින්ක් එක සාදන්න</button>

            <!-- Share කරන්න බොත්තම් -->
            <div class="share-box" id="shareBox">
                <a href="#" class="share-btn whatsapp" id="waLink" target="_blank">WhatsApp හරහා යවන්න</a>
                <a href="#" class="share-btn facebook" id="fbLink" target="_blank">Facebook හරහා යවන්න</a>
            </div>
        </div>
    </div>

    <!-- පැත්තේ තියෙන කුඩා සින්දු Button එක -->
    <button class="music-btn" id="musicBtn" onclick="playMusic()">🎵</button>

    <!-- බුදු ගුණ ගීතයේ ලින්ක් එක (SoundHelix එක වෙනුවට වෙනත් mp3 ලින්ක් එකක් දාගන්න පුළුවන්) -->
    <audio id="myAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. ලින්ක් එකෙන් නම කියවීම (බිගිනර් මට්ටමේ සරල කෝඩ් එකක්)
        var params = new URLSearchParams(window.location.search);
        var name = params.get('name');
        var display = document.getElementById('nameDisplay');

        if(name) {
            display.innerText = "✨ " + decodeURIComponent(name) + " ගෙන් ඔබට සුභ වෙසක්! ✨";
        } else {
            display.innerText = "ඔබට සුභ වෙසක් උත්සවයක් වේවා!";
        }

        // 2. සින්දුව On/Off කිරීම
        var audio = document.getElementById('myAudio');
        var btn = document.getElementById('musicBtn');

        function playMusic() {
            if (audio.paused) {
                audio.play();
                btn.innerText = "⏸️";
            } else {
                audio.pause();
                btn.innerText = "🎵";
            }
        }

        // 3. අලුත් ලින්ක් එකක් සෑදීම
        function makeLink() {
            var inputName = document.getElementById('nameInput').value;
            if(inputName == "") {
                alert("කරුණාකර නමක් ඇතුලත් කරන්න!");
                return;
            }

            var currentUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            var finalUrl = currentUrl + "?name=" + encodeURIComponent(inputName);
            var text = "පින්බර වෙසක් මංගල්‍යයක් වේවා! මගෙන් ඔයාට එවපු විශේෂ වෙසක් සුභපැතුම බලන්න මේ ලින්ක් එක open කරන්න: ";

            document.getElementById('waLink').href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text + finalUrl);
            document.getElementById('fbLink').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(finalUrl);

            document.getElementById('shareBox').style.display = "block";
            alert("ලින්ක් එක සෑදීම සාර්ථකයි! දැන් පහල ඇති බොත්තම් වලින් Share කරන්න.");
        }
    </script>
</body>
</html>
